<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Adaptive Training — personalised cycling and running training plans." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <title>Running — Adaptive Training</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/wizard.css?v=1" />
  <script>
    (function(){
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  </head>
  <body>
    <header class="header" id="app-header"></header>

    <div class="wizard-nav" id="wizard-nav" style="display:none">
      <button class="wizard-nav__back" id="wizard-back-btn" style="display:none" aria-label="Go back">
        <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
          <path d="M10 13L5 8l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
    </div>

    <div class="wizard-nav__bar-wrap" id="wizard-progress" style="display:none">
      <div class="wizard-nav__bar" id="wizard-progress-bar"></div>
    </div>
    <span class="wizard-nav__text" id="wizard-progress-text"></span>

    <main id="app-main">
      <div class="wizard">
        <div class="wizard-step" id="step-programme"></div>
      </div>
    </main>

    <script>
      document.body.dataset.backLabel = 'Create a programme';
      document.body.dataset.backHref  = 'create.html';
    </script>
    <script src="js/header.js"></script>
    <script src="js/wizard.js?v=1"></script>
    <script src="js/running-questions.js?v=1"></script>
    <script src="js/running-logic.js?v=1"></script>
    <script src="js/running-review.js?v=1"></script>
    <script src="js/running.js?v=1"></script>
  </body>
</html>
