<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cycling — Adaptive Training</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/wizard.css?v=38" />
  </head>
  <body>
    <header class="header" id="app-header"></header>

    <!-- Wizard nav: back button -->
    <div class="wizard-nav" id="wizard-nav" style="display:none">
      <button class="wizard-nav__back" id="wizard-back-btn" style="display:none" aria-label="Go back">
        <svg viewBox="0 0 16 16" fill="none" width="16" height="16">
          <path d="M10 13L5 8l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
    </div>

    <!-- Progress bar pinned to bottom -->
    <div class="wizard-nav__bar-wrap" id="wizard-progress" style="display:none">
      <div class="wizard-nav__bar" id="wizard-progress-bar"></div>
    </div>
    <span class="wizard-nav__text" id="wizard-progress-text"></span>

    <main id="app-main">
      <div class="wizard">
        <div class="wizard-step" id="step-programme"></div>
      </div>
    </main>

    <script src="js/header.js?v=39"></script>
    <script src="js/wizard.js?v=39"></script>
    <script src="js/cycling-questions.js?v=43"></script>
    <script src="js/cycling-logic.js?v=21"></script>
    <script src="js/cycling-review.js?v=41"></script>
    <script src="js/cycling.js?v=39"></script>
  </body>
</html>
